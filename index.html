<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 文件目录</title>
    <style>
        body {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 20px;
            font-family: system-ui, sans-serif;
        }
        h2 {
            color: #222;
        }
        ol {
            line-height: 2;
            padding-left: 25px;
        }
        li {
            margin: 6px 0;
        }
        a {
            color: #0969da;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>当前目录 HTML 文件列表</h2>
    <ol id="htmlList"></ol>

    <script>
        const list = document.getElementById('htmlList');
        // 当前页面文件名
        const currentFile = location.pathname.split('/').pop();

        // 加载目录并解析文件
        async function loadHtmlFiles() {
            try {
                // 请求当前目录页面
                const res = await fetch('./');
                const dirHtml = await res.text();
                const dom = document.createElement('div');
                dom.innerHTML = dirHtml;

                // 筛选所有 html 链接
                const allLinks = dom.querySelectorAll('a');
                const fileArr = [];

                allLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    // 过滤：html 文件、非当前页面、非上级目录
                    if (href 
                        && href.endsWith('.html') 
                        && href !== currentFile 
                        && !href.startsWith('..')) {
                        fileArr.push(href);
                    }
                });

                // 无文件提示
                if (fileArr.length === 0) {
                    list.innerHTML = '<li>暂无其他 HTML 文件</li>';
                    return;
                }

                // 逐个读取 title 并渲染列表
                for (const file of fileArr) {
                    const fileRes = await fetch(file);
                    const content = await fileRes.text();
                    // 正则提取 title 内容
                    const titleReg = /<title>([\s\S]*?)<\/title>/gi;
                    const match = content.match(titleReg);
                    let title = match ? match[1].trim() : file;

                    // 构建列表项
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = file;
                    a.target = '_blank'; // 新窗口打开
                    a.textContent = title;
                    li.appendChild(a);
                    list.appendChild(li);
                }
            } catch (err) {
                list.innerHTML = '<li>加载失败，请检查文件部署</li>';
                console.error(err);
            }
        }

        // 执行
        loadHtmlFiles();
    </script>
</body>
</html>
