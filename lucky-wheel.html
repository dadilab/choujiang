<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂抽签大转盘</title>
<link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#f0f2f5;
  color:#333;
  min-height:100vh;
  user-select:none;
}

/* === 顶部栏 === */
.header{
  background:#fff;
  padding:14px 28px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #e8e8e8;
}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#ff8066,#ff6b6b);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;font-weight:700;
}
.header h1{font-size:1.4rem;font-weight:700;color:#1a1a2e}
.header .subtitle{font-size:.85rem;color:#999}
.header-right{display:flex;gap:8px}

/* === 3D 按钮 === */
.btn-3d{
  display:inline-block;position:relative;
  font-family:"Yanone Kaffeesatz",sans-serif;font-weight:700;font-size:22px;
  text-decoration:none;border-radius:8px;text-align:center;
  padding:6px 28px;cursor:pointer;border:none;outline:none;
  transition:all .15s;user-select:none;
  letter-spacing:1px;
}
.btn-3d:active{top:6px}
.btn-primary{
  background:#40c940;color:#fff;
  box-shadow:0 9px #3faf3f,0 9px 20px rgba(64,201,64,.25);
}
.btn-primary:hover{background:#4bd44b}
.btn-primary:active{box-shadow:0 3px #3faf3f,0 3px 6px rgba(0,0,0,.15)}
.btn-primary:disabled{
  background:#aaa;box-shadow:0 3px #999,0 3px 6px rgba(0,0,0,.1);
  cursor:not-allowed;top:4px
}
.btn-secondary{
  background:#7993a5;color:#fff;
  box-shadow:0 9px #748c9e,0 9px 20px rgba(121,147,165,.25);
}
.btn-secondary:hover{background:#89a3b5}
.btn-secondary:active{box-shadow:0 3px #748c9e,0 3px 6px rgba(0,0,0,.15)}

/* === 主布局 === */
.main-container{
  max-width:1400px;margin:0 auto;padding:20px 28px;
  display:flex;gap:30px;align-items:flex-start;
}

/* === 左侧：转盘区域 === */
.wheel-section{flex:1;display:flex;flex-direction:column;align-items:center}

.wheel-wrapper{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  margin-top:10px
}

/* 转盘黑色外环 */
.wheel-ring{
  position:absolute;
  border-radius:50%;
  background:#222;
  z-index:1;
  pointer-events:none;
  box-shadow:0 0 30px rgba(0,0,0,.15),inset 0 0 20px rgba(0,0,0,.2);
}

/* 橙色三角指针 */
.wheel-pointer{
  position:absolute;
  top:-14px;left:50%;transform:translateX(-50%);
  z-index:5;pointer-events:none;
  width:0;height:0;
  border-left:20px solid transparent;
  border-right:20px solid transparent;
  border-top:42px solid #ff8c00;
  filter:drop-shadow(0 3px 5px rgba(255,140,0,.5));
}
.wheel-pointer::after{
  content:'';position:absolute;top:-52px;left:-10px;
  width:20px;height:20px;
  background:#ff8c00;border-radius:50%;
}

canvas#wheelCanvas{
  border-radius:50%;z-index:2;position:relative;
  transition:filter .4s;
}
canvas#wheelCanvas.spinning{filter:brightness(1.05)}

/* 中心按钮 */
.center-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:3;cursor:pointer;
  border-radius:50%;border:none;outline:none;
  background:linear-gradient(135deg,#ff8c00,#ff6b35);
  color:#fff;font-family:"Yanone Kaffeesatz",sans-serif;
  font-weight:700;font-size:28px;letter-spacing:2px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(255,107,53,.4),0 0 0 6px #fff,0 0 0 8px rgba(0,0,0,.1);
  transition:all .2s;
}
.center-btn:hover{
  background:linear-gradient(135deg,#ff9d1f,#ff7b45);
  transform:translate(-50%,-50%) scale(1.05);
}
.center-btn:active{transform:translate(-50%,-50%) scale(.95)}
.center-btn:disabled{cursor:not-allowed;opacity:.7}

/* 结果展示 */
.result-area{margin-top:24px;text-align:center;min-height:60px}
.result-label{font-size:1rem;color:#999;letter-spacing:2px}
.result-name{
  font-size:2.6rem;font-weight:900;color:#ff6b35;
  line-height:1.4;margin-top:4px;
  animation:popIn .4s ease-out;
}
@keyframes popIn{
  0%{transform:scale(.5);opacity:0}
  60%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}
.result-remain{font-size:.9rem;color:#999;margin-top:2px}

/* 按钮组 */
.btn-group{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;justify-content:center}

/* === 结果弹窗 === */
.result-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:100;display:flex;align-items:center;justify-content:center;
  animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-modal{
  background:#fff;border-radius:24px;padding:36px 44px;
  text-align:center;max-width:420px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  animation:modalBounce .4s ease-out;
}
@keyframes modalBounce{
  0%{transform:scale(.7) translateY(40px);opacity:0}
  60%{transform:scale(1.05) translateY(-5px)}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.result-modal .gift-icon{
  font-size:64px;margin-bottom:16px;display:block;
  animation:giftShake .5s ease-in-out .3s both;
}
@keyframes giftShake{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-15deg)}
  75%{transform:rotate(15deg)}
}
.result-modal h2{font-size:1.2rem;color:#666;font-weight:400;margin-bottom:8px}
.result-modal .winner-name{
  font-size:2.8rem;font-weight:900;color:#ff6b35;
  line-height:1.3;
}
.result-modal .winner-sub{font-size:.95rem;color:#999;margin-top:6px}
.result-modal .modal-close-btn{
  margin-top:24px;padding:10px 48px;border:none;border-radius:50px;
  background:#40c940;color:#fff;font-size:1.1rem;font-weight:700;
  cursor:pointer;box-shadow:0 4px 15px rgba(64,201,64,.35);
  transition:all .2s;
}
.result-modal .modal-close-btn:hover{background:#4bd44b;transform:translateY(-2px)}

/* === 右侧面板 === */
.mgmt-panel{
  width:360px;flex-shrink:0;
  background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);
  overflow:hidden;
}
.mgmt-header{
  padding:16px 20px;background:#fafafa;
  border-bottom:1px solid #f0f0f0;
  font-size:1.1rem;font-weight:700;color:#333;
  display:flex;align-items:center;gap:6px;
}
.mgmt-summary{
  padding:8px 20px;font-size:.85rem;color:#999;
  display:flex;justify-content:space-between;
  border-bottom:1px solid #f5f5f5;
}
.mgmt-list{max-height:420px;overflow-y:auto;padding:8px 12px}
.mgmt-list::-webkit-scrollbar{width:5px}
.mgmt-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}

/* 选项条目 */
.opt-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin:4px 0;
  border-radius:10px;transition:background .2s;
  cursor:default;
}
.opt-item:hover{background:#f5f7fa}
.opt-item.active{
  background:#fff3e0;border:1px solid #ffcc80;
}
.opt-color{width:26px;height:26px;border-radius:6px;flex-shrink:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.opt-info{flex:1;min-width:0}
.opt-name{font-size:1rem;font-weight:700;color:#333}
.opt-count{font-size:.8rem;color:#999}
.opt-count.depleted{color:#e74c3c}
.opt-actions{display:flex;gap:4px;flex-shrink:0}
.opt-btn{
  width:30px;height:30px;border-radius:6px;border:none;
  background:#f0f0f0;color:#666;cursor:pointer;
  font-size:.85rem;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.opt-btn:hover{background:#e0e0e0}
.opt-btn.danger:hover{background:#ffeaea;color:#e74c3c}

/* 新增表单 */
.add-row{
  padding:12px 20px;border-top:1px solid #f0f0f0;
  display:flex;gap:8px;background:#fafafa;
}
.add-row input{
  flex:1;padding:8px 12px;border:1.5px solid #d9d9d9;border-radius:8px;
  font-size:.95rem;outline:none;transition:border .3s;min-width:0;
}
.add-row input:focus{border-color:#40a9ff}
.add-row input::placeholder{color:#bbb}
.add-row .add-btn{
  padding:8px 18px;border:none;border-radius:8px;
  background:#1890ff;color:#fff;font-weight:700;
  cursor:pointer;white-space:nowrap;font-size:.95rem;
  transition:all .2s;
}
.add-row .add-btn:hover{background:#40a9ff}

/* 弹窗 */
.edit-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:100;display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s;
}
.edit-dialog{
  background:#fff;border-radius:16px;padding:28px 32px;
  min-width:340px;box-shadow:0 16px 48px rgba(0,0,0,.15);
}
.edit-dialog h3{font-size:1.2rem;text-align:center;margin-bottom:20px;color:#333}
.edit-field{margin-bottom:14px}
.edit-field label{display:block;font-size:.9rem;color:#666;margin-bottom:5px}
.edit-field input{
  width:100%;padding:10px 14px;border:1.5px solid #d9d9d9;border-radius:8px;
  font-size:1rem;outline:none;
}
.edit-field input:focus{border-color:#40a9ff}
.edit-btns{display:flex;gap:10px;margin-top:22px}
.edit-btns button{flex:1;padding:10px;border-radius:8px;font-weight:700;border:none;cursor:pointer;font-size:.95rem}
.btn-save{background:#1890ff;color:#fff}
.btn-save:hover{background:#40a9ff}
.btn-cancel{background:#f5f5f5;color:#666}
.btn-cancel:hover{background:#e8e8e8}

/* Toast */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:10px 28px;border-radius:50px;
  font-size:.95rem;font-weight:600;z-index:200;
  animation:toastIn .3s,toastOut .3s 1.8s forwards;
  pointer-events:none;
}
@keyframes toastIn{from{opacity:0;top:4px}to{opacity:1;top:24px}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* 响应式 */
@media (max-width:1000px){
  .main-container{flex-direction:column;padding:12px}
  .mgmt-panel{width:100%}
  .mgmt-list{max-height:240px}
  canvas#wheelCanvas{max-width:85vw;max-height:50vh}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">W</div>
    <div>
      <h1>课堂抽签大转盘</h1>
      <div class="subtitle" id="statusBar">共 <b id="totalCount">40</b> 个名额待抽取</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-3d btn-secondary" onclick="goBackSettings()">🔄 返回设置</button>
    <button class="btn-3d btn-secondary" onclick="resetWheel()">⟳ 重置轮盘</button>
  </div>
</div>

<div class="main-container">
  <!-- 左侧：转盘 -->
  <div class="wheel-section">
    <div class="wheel-wrapper" id="wheelWrap">
      <div class="wheel-ring" id="wheelRing"></div>
      <div class="wheel-pointer"></div>
      <canvas id="wheelCanvas"></canvas>
      <button class="center-btn" id="centerBtn" onclick="startSpin()">GO</button>
    </div>

    <div class="result-area" id="resultArea">
      <div class="result-label">点击 GO 或按空格键开始抽签</div>
    </div>

    <div class="btn-group">
      <button class="btn-3d btn-primary" id="bigSpinBtn" onclick="startSpin()">🎰 开始抽签</button>
      <button class="btn-3d btn-secondary" onclick="resetAll()">↺ 重置全部</button>
    </div>
  </div>

  <!-- 右侧面板 -->
  <div class="mgmt-panel">
    <div class="mgmt-header">📋 选项管理</div>
    <div class="mgmt-summary">
      <span id="summaryOpts">4 个选项</span>
      <span id="summaryCount">总计 40 名额</span>
    </div>
    <div class="mgmt-list" id="optList"></div>
    <div class="add-row">
      <input type="text" id="inputName" placeholder="选项名称" maxlength="12">
      <input type="number" id="inputCount" placeholder="数量" min="1" max="99" value="5" style="max-width:70px">
      <button class="add-btn" onclick="addOption()">＋ 新增</button>
    </div>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="result-modal-overlay" id="resultModal" style="display:none">
  <div class="result-modal">
    <span class="gift-icon">🎁</span>
    <h2>恭喜！中奖结果</h2>
    <div class="winner-name" id="modalWinner"></div>
    <div class="winner-sub" id="modalSub"></div>
    <button class="modal-close-btn" onclick="closeResultModal()">知道了</button>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="edit-overlay" id="editModal" style="display:none">
  <div class="edit-dialog">
    <h3>✏️ 编辑选项</h3>
    <div class="edit-field">
      <label>名称</label>
      <input type="text" id="editName" maxlength="12">
    </div>
    <div class="edit-field">
      <label>名额数量</label>
      <input type="number" id="editCount" min="1" max="99">
    </div>
    <div class="edit-btns">
      <button class="btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn-save" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
// ==================== 数据 ====================
const WHEEL_COLORS = [
  '#FF6B6B','#4ECDC4','#45B7D1','#96CEB4',
  '#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F',
  '#BB8FCE','#85C1E9','#F8C471','#82E0AA',
  '#F1948A','#73C6B6','#D7BDE2','#F9E79F'
];

let options = [
  {name:'A',count:10},{name:'B',count:10},{name:'C',count:10},{name:'D',count:10}
];
let sectors = [];
let isSpinning = false;
let currentAngle = 0;
let activeSectorIdx = -1;
let editingIdx = -1;
let hasBuiltWheel = true;

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

// ==================== 扇区构建 ====================
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function buildSectors(){
  sectors = [];
  options.forEach((o,idx) => {
    for(let i=0;i<o.count;i++){
      // 每个扇区独立颜色，按全局索引循环取色
      sectors.push({name:o.name,color:WHEEL_COLORS[sectors.length % WHEEL_COLORS.length],optIdx:idx});
    }
  });
  // 随机打乱，同选项的扇区分散在转盘各处
  shuffle(sectors);
}

function wheelSize(){
  const ws = document.querySelector('.wheel-section');
  const mw = ws.clientWidth - 60;
  const mh = window.innerHeight * 0.55;
  return Math.min(mw,mh,500);
}

function resizeAll(){
  const sz = wheelSize();
  canvas.width = sz;
  canvas.height = sz;
  // 更新黑色外环
  const ring = document.getElementById('wheelRing');
  const ringSz = sz + 24;
  ring.style.width = ringSz+'px';
  ring.style.height = ringSz+'px';
  ring.style.top = (-12)+'px';
  ring.style.left = (-12)+'px';
  // 更新指针位置
  const ptr = document.querySelector('.wheel-pointer');
  ptr.style.top = (-14-12)+'px';
  // 更新中心按钮
  const cbtn = document.getElementById('centerBtn');
  const csz = sz * 0.22;
  cbtn.style.width = csz+'px';
  cbtn.style.height = csz+'px';
  cbtn.style.fontSize = (csz*0.38)+'px';
  drawWheel();
}

// ==================== 绘制 ====================
function drawWheel(hlIdx=-1){
  const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=Math.min(cx,cy)-2;
  ctx.clearRect(0,0,w,h);
  if(sectors.length===0){
    ctx.fillStyle='#e0e0e0';
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#999';ctx.font='bold 20px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('暂无选项',cx,cy);
    return;
  }
  const ap = Math.PI*2/sectors.length;
  sectors.forEach((s,i)=>{
    const sa = currentAngle + i*ap - Math.PI/2;
    const ea = sa + ap;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();

    if(hlIdx===i){
      ctx.fillStyle='#ffd700';
      ctx.shadowColor='#ffd700';ctx.shadowBlur=18;
    }else{
      ctx.fillStyle=s.color;ctx.shadowBlur=0;
    }
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1.2;ctx.stroke();

    // 文字
    const mid = sa + ap/2;
    const tr = r*0.68;
    const tx = cx + Math.cos(mid)*tr;
    const ty = cy + Math.sin(mid)*tr;
    ctx.save();
    ctx.translate(tx,ty);ctx.rotate(mid+Math.PI/2);
    ctx.fillStyle='#333';ctx.font=`bold ${Math.max(13,r/26)}px "Microsoft YaHei"`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(s.name,0,0);
    ctx.restore();
  });

  // 装饰圆点（轮盘外围小钉）
  for(let i=0;i<Math.max(8,Math.floor(r/12));i++){
    const ang = i*(Math.PI*2/Math.max(8,Math.floor(r/12)));
    const dx = cx + Math.cos(ang)*(r+2);
    const dy = cy + Math.sin(ang)*(r+2);
    ctx.beginPath();ctx.arc(dx,dy,3,0,Math.PI*2);
    ctx.fillStyle='#ff8c00';ctx.fill();
  }
}

// ==================== 刹车缓动 ====================
// 连续自然减速：从高速旋转平滑过渡到缓慢停止，无分段跳跃
function brakeEase(t){
  return 1 - Math.pow(1 - t, 3);
}

// ==================== 旋转 ====================
function startSpin(){
  if(isSpinning||sectors.length===0)return;
  buildSectors();
  if(sectors.length===0){showToast('请先添加选项！');return;}

  isSpinning=true;
  activeSectorIdx=-1;
  document.getElementById('centerBtn').disabled=true;
  document.getElementById('bigSpinBtn').disabled=true;
  canvas.classList.add('spinning');
  document.getElementById('resultArea').innerHTML='<div class="result-label">🎲 旋转中...</div>';
  renderOptionList();

  const targetIdx = Math.floor(Math.random()*sectors.length);
  const ap = Math.PI*2/sectors.length;
  const tgAngle = currentAngle - targetIdx*ap;
  const spins = (5+Math.floor(Math.random()*6))*Math.PI*2; // 5~10 圈
  const final = tgAngle - spins;

  const startA = currentAngle;
  const delta = final - startA;
  const dur = 5500 + Math.random()*1500; // 5.5~7 秒，足够看到高速→减速→缓慢停止
  const t0 = performance.now();

  function anim(now){
    const p = Math.min((now-t0)/dur,1);
    const e = brakeEase(p);
    currentAngle = startA + delta*e;
    const hl = (p>0.80); // 最后 20% 时间开始高亮目标扇区
    drawWheel(hl?targetIdx:-1);
    if(p<1){requestAnimationFrame(anim)}
    else{
      currentAngle = ((currentAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      // 先保存中奖信息（基于 spin 前的 sectors），再重建（重建会重新打乱）
      const actualIdx = ((targetIdx%sectors.length)+sectors.length)%sectors.length;
      const won = sectors[actualIdx];
      buildSectors();
      // 在新 sectors 中找到 won 对应的扇区索引用于高亮
      const newIdx = sectors.findIndex(s=>s.name===won.name&&s.optIdx===won.optIdx);
      activeSectorIdx = newIdx>=0?newIdx:0;
      drawWheel(activeSectorIdx);
      showResult(won);
      renderOptionList();

      // 弹窗
      document.getElementById('modalWinner').textContent = won.name;
      document.getElementById('modalSub').textContent = `该选项剩余 ${Math.max(0,options[won.optIdx].count-1)} 个名额`;
      document.getElementById('resultModal').style.display='flex';

      // 0.7s 后自动扣除
      setTimeout(()=>autoDeduct(newIdx>=0?newIdx:0,won),700);

      isSpinning=false;
      document.getElementById('centerBtn').disabled=false;
      document.getElementById('bigSpinBtn').disabled=false;
      canvas.classList.remove('spinning');
    }
  }
  requestAnimationFrame(anim);
}

function showResult(won){
  const remain = Math.max(0,options[won.optIdx].count-1);
  document.getElementById('resultArea').innerHTML=`
    <div class="result-label">🎉 中奖结果</div>
    <div class="result-name">${won.name}</div>
    <div class="result-remain">剩余 ${remain} 个名额 · 已自动扣除</div>
  `;
}

function closeResultModal(){
  document.getElementById('resultModal').style.display='none';
}

function autoDeduct(idx,won){
  const oi = won.optIdx;
  if(oi>=options.length||options[oi].count<=0){
    buildSectors();drawWheel();renderOptionList();updateSummary();return;
  }
  options[oi].count--;
  if(options[oi].count===0){
    const nm = options[oi].name;
    options.splice(oi,1);
    showToast(`"${nm}" 名额已用完，已自动移除`);
  }else{
    showToast(`"${won.name}" 剩余 ${options[oi].count} 个名额`);
  }
  activeSectorIdx=-1;
  buildSectors();
  if(sectors.length===0){
    document.getElementById('resultArea').innerHTML='<div class="result-label">🎲 所有名额已用完</div>';
  }
  drawWheel();
  renderOptionList();
  updateSummary();
}

// ==================== 重置/返回 ====================
function goBackSettings(){
  if(isSpinning)return;
  // 回到设置状态：这里就是始终显示的界面
  showToast('已在设置界面');
}

function resetWheel(){
  if(isSpinning)return;
  currentAngle=0;activeSectorIdx=-1;
  drawWheel();
  document.getElementById('resultArea').innerHTML='<div class="result-label">点击 GO 或按空格键开始抽签</div>';
  renderOptionList();
  showToast('转盘已重置（选项不变）');
}

function resetAll(){
  if(isSpinning)return;
  if(!confirm('确定重置为默认 A/B/C/D 各10个？'))return;
  options=[{name:'A',count:10},{name:'B',count:10},{name:'C',count:10},{name:'D',count:10}];
  currentAngle=0;activeSectorIdx=-1;
  buildSectors();drawWheel();
  document.getElementById('resultArea').innerHTML='<div class="result-label">点击 GO 或按空格键开始抽签</div>';
  renderOptionList();updateSummary();
  showToast('已重置为默认选项');
}

// ==================== 选项管理 ====================
function addOption(){
  const ni=document.getElementById('inputName'),ci=document.getElementById('inputCount');
  const nm=ni.value.trim(),cnt=parseInt(ci.value)||0;
  if(!nm){showToast('请输入名称');return}
  if(cnt<1||cnt>99){showToast('数量 1-99');return}
  if(options.some(o=>o.name===nm)){showToast('名称已存在');return}
  options.push({name:nm,count:cnt});
  ni.value='';ci.value='5';
  activeSectorIdx=-1;
  buildSectors();drawWheel();renderOptionList();updateSummary();
  showToast(`已添加 "${nm}"`);
}

function startEdit(idx){
  editingIdx=idx;
  document.getElementById('editName').value=options[idx].name;
  document.getElementById('editCount').value=options[idx].count;
  document.getElementById('editModal').style.display='flex';
  document.getElementById('editName').focus();
}

function saveEdit(){
  const nm=document.getElementById('editName').value.trim();
  const cnt=parseInt(document.getElementById('editCount').value)||0;
  if(!nm){showToast('请输入名称');return}
  if(cnt<1||cnt>99){showToast('数量 1-99');return}
  if(options.some((o,i)=>i!==editingIdx&&o.name===nm)){showToast('名称已存在');return}
  options[editingIdx].name=nm;options[editingIdx].count=cnt;
  closeEdit();buildSectors();drawWheel();renderOptionList();updateSummary();
  showToast('已更新');
}

function closeEdit(){
  document.getElementById('editModal').style.display='none';
  editingIdx=-1;
}

function deleteOpt(idx){
  if(isSpinning)return;
  const o=options[idx];
  if(!confirm(`删除 "${o.name}"（${o.count}个名额）？`))return;
  options.splice(idx,1);
  activeSectorIdx=-1;
  buildSectors();
  if(sectors.length===0){
    drawWheel();
    document.getElementById('resultArea').innerHTML='<div class="result-label">🎲 无可用选项</div>';
  }else drawWheel();
  renderOptionList();updateSummary();
  showToast(`已删除 "${o.name}"`);
}

// ==================== 列表渲染 ====================
function renderOptionList(){
  const ct = document.getElementById('optList');
  if(options.length===0){
    ct.innerHTML='<div style="text-align:center;color:#bbb;padding:30px">暂无选项，请在下方添加</div>';
    return;
  }
  ct.innerHTML=options.map((o,i)=>{
    const clr=WHEEL_COLORS[i % WHEEL_COLORS.length];
    const activeCls = (activeSectorIdx>=0&&sectors[activeSectorIdx]&&sectors[activeSectorIdx].optIdx===i)?' active':'';
    const depletedCls = o.count===0?' depleted':'';
    return `
    <div class="opt-item${activeCls}">
      <div class="opt-color" style="background:${clr}"></div>
      <div class="opt-info">
        <div class="opt-name">${o.name}</div>
        <div class="opt-count${depletedCls}">${o.count} 个名额</div>
      </div>
      <div class="opt-actions">
        <button class="opt-btn" onclick="startEdit(${i})" title="编辑">✎</button>
        <button class="opt-btn danger" onclick="deleteOpt(${i})" title="删除">✕</button>
      </div>
    </div>`;
  }).join('');
}

function updateSummary(){
  const t = options.reduce((s,o)=>s+o.count,0);
  document.getElementById('summaryOpts').textContent=`${options.length} 个选项`;
  document.getElementById('summaryCount').textContent=`总计 ${t} 名额`;
  document.getElementById('totalCount').textContent=t;
  document.getElementById('statusBar').innerHTML=`共 <b id="totalCount">${t}</b> 个名额待抽取`;
}

// ==================== Toast ====================
let toastT;
function showToast(msg){
  const ex=document.querySelector('.toast');if(ex)ex.remove();
  clearTimeout(toastT);
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  toastT=setTimeout(()=>el.remove(),2200);
}

// ==================== 事件 ====================
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!isSpinning)startSpin();}
  if(e.code==='Escape'){closeEdit();closeResultModal();}
});
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeEdit();});
document.getElementById('resultModal').addEventListener('click',function(e){if(e.target===this)closeResultModal();});
window.addEventListener('resize',resizeAll);

function init(){
  buildSectors();resizeAll();drawWheel();renderOptionList();updateSummary();
}
init();
</script>
</body>
</html>
